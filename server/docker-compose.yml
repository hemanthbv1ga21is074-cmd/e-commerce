version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stylebazaar_postgres
    restart: always
    environment:
      POSTGRES_USER: stylebazaar_user
      POSTGRES_PASSWORD: stylebazaar_secure_password_2026
      POSTGRES_DB: stylebazaar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylebazaar_user -d stylebazaar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
